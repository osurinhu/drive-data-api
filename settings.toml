# Configuração da aplicação (Dynaconf).
#
# REGRA: este arquivo é versionado, portanto NÃO contém segredos.
# Valores sensíveis (SECRET_KEY, JWT_SECRET_KEY e as URIs do Postgres, do Mongo e do
# RabbitMQ) vêm de variáveis de ambiente com o prefixo FLASK_, carregadas do .env
# (não versionado).
# Ex.: FLASK_JWT_SECRET_KEY no ambiente  ->  app.config["JWT_SECRET_KEY"]
# Veja .env.example para a lista completa.
#
# PERFIS: a mesma imagem roda vários processos (o api, o bronze-api, o consumer e o
# job setup), e a variável FLASK_PROCESS escolhe a seção deste arquivo que vale
# para cada um ([api], [bronze_api], [consumer], [setup]). A seção do perfil se
# sobrepõe ao [default] chave a chave; uma lista declarada no perfil substitui a
# do [default] por inteiro. Sem FLASK_PROCESS vale só o [default], que carrega
# tudo: é o perfil do desenvolvimento e da suíte. FLASK_PROCESS com um nome que
# não é seção daqui reprova a inicialização.

[default]

# --- Identidade e documentação da API ----------------------------------------
API_TITLE = "Drive Data API"
API_VERSION = "v1"
OPENAPI_VERSION = "3.0.3"
OPENAPI_URL_PREFIX = "/api/v1"
OPENAPI_SWAGGER_UI_PATH = "/"
OPENAPI_SWAGGER_UI_URL = "https://cdn.jsdelivr.net/npm/swagger-ui-dist/"
OPENAPI_JSON_PATH = "openapi.json"

# --- Flask --------------------------------------------------------------------
# Deixe PROPAGATE_EXCEPTIONS desligado: o handler global converte exceções não
# tratadas em um 500 com o envelope padrão (ver app/ext/error_handler.py).
PROPAGATE_EXCEPTIONS = false

# Teto do corpo de cada requisição: acima dele, a resposta é 413. 1 MiB cabe com folga num
# lote de 500 registros, cerca de 300 KB; o número de registros e de leituras fica no schema.
MAX_CONTENT_LENGTH = 1048576

LOG_LEVEL = "INFO"
# json: uma linha por evento, com os ids de correlação. text: para ler localmente.
LOG_FORMAT = "json"

# --- Persistência -------------------------------------------------------------
# Sem valor padrão de propósito: a URI precisa vir do ambiente.
# A aplicação falha na inicialização com mensagem explícita se estiver vazia.
SQLALCHEMY_DATABASE_URI = ""

# Pool de conexões. A conta que importa:
#   (workers do gunicorn) x (pool_size + max_overflow)  <=  max_connections do Postgres
# Com os padrões abaixo e WEB_CONCURRENCY=2: 2 x 10 = 20 conexões no pior caso,
# folgado para o padrão de 100 do Postgres. Ao subir os workers, refaça a conta.
#   pool_pre_ping: descarta conexão morta antes de usar (evita o primeiro erro
#                  depois de o banco reiniciar).
#   pool_recycle:  recicla conexão após 30min, antes que proxy ou firewall
#                  derrube a ociosa e o erro apareça só em produção.
SQLALCHEMY_ENGINE_OPTIONS = { pool_pre_ping = true, pool_size = 5, max_overflow = 5, pool_recycle = 1800 }

# --- MongoDB (camada bronze) --------------------------------------------------
# A URI, com usuário e senha, vem de FLASK_MONGO_URI. Sem valor padrão de
# propósito: o processo que carrega ext.mongo não sobe sem ela.
MONGO_URI = ""
MONGO_DATABASE = "drive_data_bronze"
# Espera máxima por um servidor disponível e pela abertura da conexão. Curta de
# propósito: com o Mongo fora, a requisição falha logo, em vez de prender o worker
# do gunicorn até o timeout dele (30 s).
MONGO_TIMEOUT_SECONDS = 5
# Prazo de cada operação do consumer no bronze (a hora do servidor, a gravação do
# lote), inclusive a espera por um servidor: dentro dele, o MONGO_TIMEOUT_SECONDS
# não vale. Estourou, o lote volta para a fila sem contar como falha, como com o
# Mongo fora. Fica bem abaixo de dois heartbeats do AMQP: o consumer que espera mais que
# isso perde a conexão com o broker, e aí a entrega conta.
BRONZE_WRITE_TIMEOUT_SECONDS = 10
# Prazo de cada operação do bronze-api no bronze, inclusive a espera por um servidor.
# Cada leitura faz duas (a hora do servidor e a página): com o Mongo fora ou mudo, a
# requisição responde 503 em até duas vezes isto, bem antes do timeout do gunicorn (30 s).
BRONZE_READ_TIMEOUT_SECONDS = 5
# A janela de estabilização da leitura da silver: só sai o que o bronze gravou há mais
# disto, pelo relógio do próprio bronze (o mesmo que carimba o ingested_at). É o que
# garante que nada grave atrás de um cursor que a silver já passou, desde que entre o
# consumer carimbar o registro e a gravação ficar visível passe menos que isto. O custo
# é a defasagem: a silver vê cada registro uns 30 s depois de ele chegar ao bronze.
BRONZE_SETTLE_SECONDS = 30
# Quantos dias o bronze e as recusas ficam guardados, contados da gravação. 0 desliga a
# retenção. Aplicados pelo `flask mongo setup` (mudar aqui exige rodar o setup de novo);
# encurtar o prazo apaga o que ficou velho demais. Os 365 dias do bronze ainda precisam
# de confirmação jurídica (LGPD).
BRONZE_RETENTION_DAYS = 365
REJECTIONS_RETENTION_DAYS = 30
# As senhas dos usuários do bronze (bronze_writer, do consumer, e bronze_reader, da
# silver), que o `flask mongo setup` aplica. Vêm de FLASK_MONGO_WRITER_PASSWORD e
# FLASK_MONGO_READER_PASSWORD, e só o job setup as recebe nessa forma: os outros
# processos têm a própria URI.
MONGO_WRITER_PASSWORD = ""
MONGO_READER_PASSWORD = ""

# --- RabbitMQ (fila da telemetria) --------------------------------------------
# A URL, com usuário, senha e vhost, vem de FLASK_AMQP_URL.
AMQP_URL = ""
# Prazo de abertura da conexão e de cada operação no socket.
AMQP_TIMEOUT_SECONDS = 5
# O broker derruba a conexão que passar dois intervalos sem sinal.
AMQP_HEARTBEAT_SECONDS = 60
# Mensagens entregues ao consumer e ainda sem confirmação, por conexão. Elas
# esperam no próprio consumer enquanto ele grava a anterior; o que não foi
# confirmado volta para a fila se ele cair.
AMQP_PREFETCH = 20
# Entregas que falharam (o consumer recusou com reject, ou caiu com a mensagem
# pendente) antes de a mensagem ir para a DLQ. Vai na policy da fila, aplicada pelo
# `flask rabbitmq setup`: mudar aqui exige rodar o setup de novo. A falha transitória
# (o bronze fora) não conta.
AMQP_DELIVERY_LIMIT = 10
# O teto da fila em bytes (2 GiB), a contrapressão: cheia, o broker recusa a publicação
# (`overflow = reject-publish`), e o envio de lote responde 503 com Retry-After. Também
# vai na policy: mudar aqui exige rodar o setup de novo.
AMQP_QUEUE_MAX_BYTES = 2147483648
# A API de gerenciamento (http://usuario:senha@host:15672), por onde o job setup
# aplica a topologia (`flask rabbitmq setup`). Vem de FLASK_AMQP_MANAGEMENT_URL, e só
# o setup a recebe: os processos que publicam ou consomem não têm a credencial de
# operação.
AMQP_MANAGEMENT_URL = ""
# Os usuários do producer e do consumer, que o `flask rabbitmq setup` cria com o mínimo
# de permissão no vhost. As senhas vêm de FLASK_AMQP_PRODUCER_PASSWORD e
# FLASK_AMQP_CONSUMER_PASSWORD, e só o job setup as recebe nessa forma: os outros
# processos têm a própria URL, que precisa usar estes nomes.
AMQP_PRODUCER_USER = "drive_producer"
AMQP_CONSUMER_USER = "drive_consumer"
AMQP_PRODUCER_PASSWORD = ""
AMQP_CONSUMER_PASSWORD = ""

# --- Consumer -----------------------------------------------------------------
# A porta do servidor de saúde do consumer (/health/live e /health/ready). Não é
# publicada no host: o healthcheck roda dentro do container, e as réplicas não disputam
# porta.
CONSUMER_HEALTH_PORT = 8081

# --- Ingestão de telemetria (producer) ----------------------------------------
# O Retry-After do 503 quando a fila não confirma o lote: o app guarda o lote e
# reenvia depois desse prazo.
INGEST_RETRY_AFTER_SECONDS = 30

# --- Disponibilidade (/health/) -----------------------------------------------
# Cada extensão que conecta um serviço registra uma sonda, e o /health/ informa
# uma chave por dependência carregada no processo. Só a queda de uma dependência
# listada aqui responde 503 e tira o processo do balanceador; as outras aparecem
# como "unreachable", com status "degraded" e 200.
HEALTH_CRITICAL = ["database"]
# Teto das sondas do Mongo e do RabbitMQ (a do banco usa o pool do SQLAlchemy,
# como sempre usou). Fica bem abaixo do timeout do healthcheck do api e do
# bronze-api no compose (5 s): uma dependência não crítica lenta não pode
# derrubar o health inteiro.
HEALTH_PROBE_TIMEOUT_SECONDS = 2

# --- Autenticação -------------------------------------------------------------
# 15 min: é o tempo que um token de acesso continua valendo depois do logout. A sessão
# longa do app mobile fica com o token de renovação (30 dias), que gira a cada uso e é
# revogável, e o `iss` amarra os dois à emissão desta aplicação.
JWT_ACCESS_TOKEN_EXPIRES = 900
JWT_REFRESH_TOKEN_EXPIRES = 2592000
JWT_ENCODE_ISSUER = "drive-data"
JWT_DECODE_ISSUER = "drive-data"

# --- CORS ---------------------------------------------------------------------
# Nenhuma origem: o app mobile e a silver não são navegadores, e o Swagger da própria API
# roda na mesma origem. Um frontend web entra aqui, pelo domínio.
CORS_ORIGINS = []

# Os limites de paginação ficam em app/schemas/pagination_schema.py, junto do
# schema que os valida — para não haver duas fontes de verdade.

# --- Registro dinâmico de módulos --------------------------------------------
# Cada item de EXTENSIONS é um módulo que expõe init_app(app). A ordem importa:
# "ext.observability" fica primeiro (o resto já loga com request id) e "ext.api"
# por último, porque registra os blueprints, que dependem de todo o resto já
# estar inicializado.
# "ext.config" NÃO entra aqui — create_app() já o inicializa explicitamente.
#
# O [default] carrega a união dos perfis, para que a suíte exercite tudo. Módulo
# novo entra aqui E no perfil de cada processo que o usa; tests/unit/test_composicao.py
# reprova se as duas coisas divergirem.
EXTENSIONS = [
    "ext.observability",
    "ext.metrics",
    "ext.database",
    "ext.mongo",
    "ext.rabbitmq",
    "ext.container",
    "ext.consumer_container",
    "ext.auth",
    "ext.cors",
    "ext.error_handler",
    "ext.commands",
    "ext.consumer",
    "ext.api",
]

# Cada item é um módulo que expõe um Blueprint chamado `blp`, registrado como
# filho do blueprint /api/v1. Rota nova = uma linha aqui e outra no perfil do
# processo que a serve.
API_V1_ROUTES = [
    "blueprint.restapi.v1.health",
    "blueprint.restapi.v1.auth",
    "blueprint.restapi.v1.registration",
    "blueprint.restapi.v1.vehicle",
    "blueprint.restapi.v1.vehicle_driver",
    "blueprint.restapi.v1.telemetry",
    "blueprint.restapi.v1.bronze",
]


# =============================================================================
# Perfis por processo (FLASK_PROCESS). Cada um declara as próprias listas: a
# extensão que não está na lista do processo não é inicializada (não exige
# configuração, não conecta e não aparece no health dele), e a rota nem é importada.
# (Serviços, repositórios e adaptadores ficam todos declarados no ext/container.py,
# comum aos processos HTTP.)
# =============================================================================

# Producer: cadastro, login, veículos e o recebimento dos lotes do app. Usa o
# Postgres e o RabbitMQ; não conhece o Mongo.
[api]
EXTENSIONS = [
    "ext.observability",
    "ext.metrics",
    "ext.database",
    "ext.rabbitmq",
    "ext.container",
    "ext.auth",
    "ext.cors",
    "ext.error_handler",
    "ext.commands",
    "ext.api",
]
API_V1_ROUTES = [
    "blueprint.restapi.v1.health",
    "blueprint.restapi.v1.auth",
    "blueprint.restapi.v1.registration",
    "blueprint.restapi.v1.vehicle",
    "blueprint.restapi.v1.vehicle_driver",
    "blueprint.restapi.v1.telemetry",
]
# O RabbitMQ fora não tira o processo do balanceador: login e cadastro seguem
# funcionando, e só o envio de lote responde 503.
HEALTH_CRITICAL = ["database"]

# API da camada silver: login e leitura do bronze. Usa o Postgres (usuários) e o
# Mongo; não conhece o RabbitMQ.
[bronze_api]
EXTENSIONS = [
    "ext.observability",
    "ext.metrics",
    "ext.database",
    "ext.mongo",
    "ext.container",
    "ext.auth",
    "ext.cors",
    "ext.error_handler",
    "ext.commands",
    "ext.api",
]
API_V1_ROUTES = [
    "blueprint.restapi.v1.health",
    "blueprint.restapi.v1.auth",
    "blueprint.restapi.v1.bronze",
]
HEALTH_CRITICAL = ["database", "mongo"]

# Consumer: lê a fila e grava no bronze (`flask consumer run`). Sem HTTP, sem
# Postgres e sem JWT; o container de DI é o próprio (ext.consumer_container).
[consumer]
EXTENSIONS = [
    "ext.observability",
    "ext.mongo",
    "ext.rabbitmq",
    "ext.consumer_container",
    "ext.consumer",
]
API_V1_ROUTES = []
# Sem rota, sem /health/: nada aqui é crítico para um health que não existe.
HEALTH_CRITICAL = []

# Job de preparação (docker/setup.sh): as migrações, a topologia do RabbitMQ e os
# índices do bronze. As migrações rodam pelo Alembic, que lê a configuração sem
# montar a aplicação; a topologia e os índices, pelos comandos `flask rabbitmq
# setup` e `flask mongo setup`, que as duas extensões registram.
[setup]
EXTENSIONS = ["ext.observability", "ext.mongo", "ext.rabbitmq"]
API_V1_ROUTES = []
HEALTH_CRITICAL = []
